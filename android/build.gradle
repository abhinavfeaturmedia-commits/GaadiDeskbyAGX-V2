// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                details.useVersion '1.8.22'
            }
            if (details.requested.group == 'androidx.core' && (details.requested.name == 'core' || details.requested.name == 'core-ktx')) {
                details.useVersion '1.13.1'
                details.because 'androidx.core 1.17+ requires compileSdk 36 and AGP 8.9.1+'
            }
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        if (project.extensions.findByName('kotlin') != null) {
            try {
                project.kotlin {
                    jvmToolchain(17)
                }
            } catch (Exception e) {}
        }
        if (project.extensions.findByName('java') != null) {
            try {
                project.java {
                    toolchain {
                        languageVersion = JavaLanguageVersion.of(17)
                    }
                }
            } catch (Exception e) {}
        }
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}
